<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Book Reccs - AI-Powered Book Recommendations | Find Your Next Favorite Read</title>
    <meta name="title" content="Book Reccs - AI-Powered Book Recommendations | Find Your Next Favorite Read" />
    <meta name="description" content="Get personalized book recommendations powered by AI. Enter your favorite books and discover your next great read. Find trending books, similar reads, and curated recommendations based on your reading preferences." />
    <meta name="keywords" content="book recommendations, book suggestions, AI book recommendations, find books to read, book discovery, reading recommendations, book suggestions AI, trending books, similar books, book finder, reading list, book recommendations engine" />
    <meta name="author" content="Furquan Ahmad" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bookreccs.netlify.app/" />
    <meta property="og:title" content="Book Reccs - AI-Powered Book Recommendations" />
    <meta property="og:description" content="Get personalized book recommendations powered by AI. Enter your favorite books and discover your next great read." />
    <meta property="og:image" content="https://bookreccs.netlify.app/book-reccs-cover.png" />
    <meta property="og:site_name" content="Book Reccs" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bookreccs.netlify.app/" />
    <meta property="twitter:title" content="Book Reccs - AI-Powered Book Recommendations" />
    <meta property="twitter:description" content="Get personalized book recommendations powered by AI. Enter your favorite books and discover your next great read." />
    <meta property="twitter:image" content="https://bookreccs.netlify.app/book-reccs-cover.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://bookreccs.netlify.app/" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Book Reccs",
      "description": "AI-powered book recommendation engine that helps you discover your next favorite read based on your reading preferences",
      "url": "https://bookreccs.netlify.app/",
      "applicationCategory": "EntertainmentApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Person",
        "name": "Furquan Ahmad",
        "url": "https://www.furquan101.com/"
      },
      "featureList": [
        "AI-powered book recommendations",
        "Personalized reading suggestions",
        "Trending books discovery",
        "Similar books finder",
        "Book filters (fast-paced, page-turner, timeless classic, etc.)"
      ]
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Book Reccs",
      "url": "https://bookreccs.netlify.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bookreccs.netlify.app/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
