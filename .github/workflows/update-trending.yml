name: Update Trending Books

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:        # Allow manual runs from the Actions tab

jobs:
  update-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch trending books
        run: node scripts/fetch-trending.js
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/trending.json
          git diff --cached --quiet && echo "No changes to trending.json" || (
            git commit -m "chore: update trending books [skip ci]" &&
            git push
          )
